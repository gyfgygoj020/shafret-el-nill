<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شفرة النيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead6;--card:#fffaf0;--tx:#1d2a3a;--mut:#6b6455;--gold:#b8860b;--lap:#1f4e8c;--ok:#1f7a4d;--bad:#b3392f;--ln:#d9c9a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b2d;--card:#172640;--tx:#f2e8cf;--mut:#a9b3c4;--gold:#e0b84a;--lap:#6fa3e8;--ok:#4cc28a;--bad:#ef7a6f;--ln:#2c4268}}
:root[data-theme="dark"]{--bg:#0f1b2d;--card:#172640;--tx:#f2e8cf;--mut:#a9b3c4;--gold:#e0b84a;--lap:#6fa3e8;--ok:#4cc28a;--bad:#ef7a6f;--ln:#2c4268}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
#app{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:2.6rem;font-weight:900;margin:.2em 0;color:var(--gold);letter-spacing:0}
.hg{font-family:'Noto Sans Egyptian Hieroglyphs','Segoe UI Historic','Segoe UI Symbol',sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;color:var(--mut)}
.card{background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:16px;margin:12px 0}
.case{display:flex;gap:14px;align-items:center;width:100%;text-align:right;font:inherit;color:inherit;cursor:pointer}
.case:hover{border-color:var(--gold)}
.case .ic{font-size:2.2rem}.case b{font-size:1.15rem}.case small{display:block;color:var(--mut)}
.btn{background:var(--lap);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:700 1rem Cairo,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--tx);border:2px solid var(--ln)}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:10px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--lap)}
.opt.g{border-color:var(--ok);background:rgba(76,194,138,.18)}.opt.b{border-color:var(--bad);background:rgba(239,122,111,.18)}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:100%}
.fb{border-radius:12px;padding:12px;margin-top:12px;border:2px solid}.fb.g{border-color:var(--ok)}.fb.b{border-color:var(--bad)}
.clue{padding:8px 12px;border-right:4px solid var(--gold);margin:6px 0;background:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:8px 12px;font:inherit;color:var(--tx);cursor:pointer}
.chip.used{opacity:.35}
.glyph{font-size:2.4rem;line-height:1.2}
.key{display:flex;flex-direction:column;align-items:center;min-width:46px;font-size:.85rem;color:var(--mut)}
.key span:first-child{font-size:1.8rem;color:var(--tx)}
.seal{font-size:3rem}
h2{margin:.2em 0 .6em;font-size:1.3rem}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab{background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:10px;padding:8px 14px;font:700 .95rem Cairo,sans-serif;cursor:pointer}
.tab.active{background:var(--lap);color:#fff;border-color:var(--lap)}
.info-item{border-bottom:1px solid var(--ln);padding:10px 0}.info-item:last-child{border:0}
.badge{display:inline-block;background:rgba(184,134,11,.15);color:var(--gold);font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:6px}
.inp{width:100%;padding:12px;border-radius:10px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);font:700 1.05rem Cairo,sans-serif}
.cartouche{border:3px solid var(--gold);border-radius:999px;padding:14px 28px;display:inline-flex;gap:8px;background:rgba(184,134,11,.08);margin:14px 0;flex-wrap:wrap;justify-content:center;min-width:120px}
.small-mut{color:var(--mut);font-size:.9rem}
:root,:root:not([data-theme="light"]){--bg:#10002b;--card:#1d0b45;--tx:#fff4e0;--mut:#c9b8f0;--gold:#ffc300;--lap:#7b2ff7;--ok:#00e0a4;--bad:#ff4d6d;--ln:#4a2a8a}
body{background:radial-gradient(circle at 15% 0,#3a0ca3 0,transparent 45%),radial-gradient(circle at 95% 15%,#f72585 0,transparent 32%),var(--bg);background-attachment:fixed}
h1{background:linear-gradient(90deg,#ffc300,#ff4d6d,#f72585);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(135deg,#f72585,#7b2ff7);box-shadow:0 4px 0 #3a0ca3;transition:transform .1s}.btn:active{transform:translateY(3px);box-shadow:none}
.tab.active{background:linear-gradient(135deg,#ffc300,#ff4d6d);color:#1a0033;border-color:transparent}
.case:hover,.opt:hover:not(:disabled){border-color:#ffc300;box-shadow:0 0 14px rgba(255,195,0,.45)}
.lang{background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:10px;padding:8px;font:700 .9rem Cairo,sans-serif}
.gen{border:2px solid var(--c);border-right-width:8px;border-radius:12px;margin:10px 0;background:var(--card)}
.gen summary{padding:12px 14px;cursor:pointer;font-size:1.05rem}.gen .gb{padding:0 14px 14px}
.chip2{display:inline-block;background:var(--c);color:#14002e;font-weight:700;border-radius:999px;padding:3px 12px;margin:3px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-inline-end:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MAP={ا:'𓄿',ب:'𓃀',ت:'𓏏',ر:'𓂋',ص:'𓋴',ك:'𓎡',ل:'𓃭',م:'𓅓',ن:'𓈖',ي:'𓇋'};
const CASES=[
{id:'a',ic:'🏺',t:'القضية الأولى: آثار مصر',d:'من الأهرامات إلى الجوامع والكنائس',q:[
{k:'clue',c:['بُني قبل نحو 4500 سنة','ظل أطول بناء صنعه الإنسان قرابة 3800 سنة','يقع في الجيزة'],o:['هرم خوفو','هرم زوسر','معبد الأقصر','قلعة صلاح الدين'],a:0,e:'هرم خوفو هو الهرم الأكبر في الجيزة، وهو من عجائب الدنيا السبع القديمة.'},
{k:'mc',q:'قلعة قايتباي بالإسكندرية بُنيت في موقع أي معلم قديم؟',o:['منارة الإسكندرية','معبد دندرة','هرم ميدوم','معبد أبو سمبل'],a:0,e:'بُنيت القلعة في القرن الخامس عشر على موقع منارة الإسكندرية من العصر اليوناني الروماني.'},
{k:'mc',q:'إلى أي عصر تنتمي الكنيسة المعلقة بمصر القديمة؟',o:['الفرعوني','القبطي','الحديث','اليوناني'],a:1,e:'الكنيسة المعلقة من أشهر الكنائس القبطية في القاهرة.'},
{k:'mc',q:'أين يقع المتحف القومي للحضارة المصرية؟',o:['الأقصر','أسوان','الفسطاط بالقاهرة','الإسكندرية'],a:2,e:'يقع في الفسطاط، وفيه قاعة المومياوات الملكية.'},
{k:'order',q:'رتّب العصور من الأقدم إلى الأحدث:',items:['الفرعوني','اليوناني الروماني','القبطي','الإسلامي'],e:'الفرعوني ثم اليوناني الروماني ثم القبطي ثم الإسلامي.'}]},
{id:'b',ic:'🏙️',t:'القضية الثانية: المدن الجديدة',d:'أجيال العمران من الأول إلى الرابع',q:[
{k:'mc',q:'العاصمة الإدارية الجديدة من أي جيل من المدن؟',o:['الأول','الثاني','الثالث','الرابع'],a:3,e:'تُصنَّف ضمن مدن الجيل الرابع.'},
{k:'mc',q:'العلمين الجديدة تقع على ساحل أي بحر؟',o:['الأحمر','المتوسط','قناة السويس','بحيرة ناصر'],a:1,e:'تقع على الساحل الشمالي الغربي على البحر المتوسط.'},
{k:'mc',q:'المنصورة الجديدة تتبع أي محافظة؟',o:['الدقهلية','أسوان','المنيا','الإسماعيلية'],a:0,e:'تتبع الدقهلية وتطل على البحر المتوسط.'},
{k:'clue',c:['من مدن الجيل الأول','تقع في محافظة الشرقية','اسمها يذكّر بحرب 1973'],o:['العاشر من رمضان','السادس من أكتوبر','الشروق','بدر'],a:0,e:'مدينة العاشر من رمضان من أولى المدن الصناعية الجديدة.'},
{k:'mc',q:'مدينة الجلالة الجديدة تطل على أي ساحل؟',o:['المتوسط','الأحمر (خليج السويس)','النيل','بحيرة قارون'],a:1,e:'تقع فوق هضبة الجلالة وتطل على خليج السويس.'}]},
{id:'c',ic:'🏛️',t:'القضية الثالثة: رؤساء الجمهورية',d:'من محمد نجيب إلى عبد الفتاح السيسي',q:[
{k:'order',q:'رتّب الرؤساء حسب تولّيهم الحكم:',items:['محمد نجيب','جمال عبد الناصر','أنور السادات','حسني مبارك','عبد الفتاح السيسي'],e:'نجيب (1953) ثم ناصر ثم السادات ثم مبارك ثم السيسي.'},
{k:'mc',q:'من أول رئيس لجمهورية مصر بعد إعلانها عام 1953؟',o:['محمد نجيب','جمال عبد الناصر','أنور السادات','حسني مبارك'],a:0,e:'محمد نجيب هو أول رئيس للجمهورية.'},
{k:'mc',q:'في عهد من وقعت حرب أكتوبر 1973؟',o:['عبد الناصر','السادات','مبارك','نجيب'],a:1,e:'حدث العبور في عهد الرئيس أنور السادات.'},
{k:'mc',q:'من الرئيس الذي أمّم قناة السويس عام 1956؟',o:['جمال عبد الناصر','حسني مبارك','محمد نجيب','السادات'],a:0,e:'أعلن عبد الناصر تأميم القناة في يوليو 1956.'},
{k:'mc',q:'مدة حكم حسني مبارك التقريبية؟',o:['10 سنوات','20 سنة','30 سنة','45 سنة'],a:2,e:'من 1981 إلى 2011 تقريباً.'}]},
{id:'d',ic:'𓂀',t:'القضية الرابعة: شفرة الهيروغليفية',d:'فك الرموز لفتح الخزانة الأخيرة',q:[
{k:'hiero',w:'نيل',e:'نيل: شريان الحياة في مصر.'},
{k:'hiero',w:'مصر',e:'مصر: أرض الحضارة.'},
{k:'hiero',w:'ملك',e:'ملك: كان يُكتب اسمه داخل خرطوش.'},
{k:'hiero',w:'كتاب',e:'كتاب: الكتبة كانوا من أهم الطبقات في مصر القديمة.'},
{k:'mc',q:'ما اسم الإطار البيضاوي الذي يحيط باسم الملك في الكتابة الهيروغليفية؟',o:['الخرطوش','المسلة','التابوت','الصولجان'],a:0,e:'الخرطوش يحمي اسم الملك.'}]}
];
const LV=[[0,'متدرب'],[400,'باحث آثار'],[900,'محقق أثري'],[1400,'كبير المحققين']];
let S={score:0,seals:{},c:null,i:0,ok:0,left:30,lock:false,cl:1,tm:null,pick:[]};
const $=s=>document.querySelector(s);
const sh=a=>[...a].sort(()=>Math.random()-.5);
const lvl=()=>LV.filter(l=>S.score>=l[0]).pop()[1];
const bar=()=>`<div class="top"><span>🏅 ${lvl()}</span><span>⭐ ${S.score}</span></div>`;
function homeBase(){
 clearInterval(S.tm);
 const done=Object.keys(S.seals).length>=4;
 $('#app').innerHTML=bar()+`<h1>شفرة النيل <span class="hg">𓂀</span></h1>
 <p>سُرقت شفرة النيل من القاهرة الخفية! اكشف الخيوط في أربع قضايا قبل أن تهرب العصابة.</p>`+
 CASES.map(c=>`<button class="card case" onclick="start('${c.id}')"><span class="ic hg">${c.ic}</span><span><b>${c.t}</b><small>${c.d}</small></span><span class="seal" style="margin-right:auto;font-size:1.8rem">${S.seals[c.id]||''}</span></button>`).join('')+
 (done?`<div class="card"><b>🎉 حللت اللغز!</b><p>وصلت إلى لقب «${lvl()}» بمجموع ${S.score} نقطة. أعد المحاولة لتحصل على أختام أعلى.</p></div>`:'');
}
function start(id){S.c=CASES.find(x=>x.id==id);S.i=0;S.ok=0;ask();}
function ask(){
 if(S.i>=S.c.q.length)return end();
 const q=S.c.q[S.i];S.lock=false;S.cl=1;S.left=30;S.pick=[];
 let body='';
 if(q.k=='mc'||q.k=='clue'){
  S.opts=sh(q.o.map((t,i)=>[t,i]));
  body=(q.k=='clue'?'<p>🔍 اكشف الخيوط لتحدد المكان:</p><div id="clues"></div><button class="btn alt" id="more" onclick="more()">اكشف خيطاً آخر (−40 نقطة)</button>':`<h2>${q.q}</h2>`)+
   S.opts.map((o,j)=>`<button class="opt" onclick="pickOpt(${j})">${o[0]}</button>`).join('');
 }else if(q.k=='order'){
  S.opts=sh(q.items);
  body=`<h2>${q.q}</h2><div class="row" id="ch"></div><div class="row" id="pl"></div><div class="row"><button class="btn alt" onclick="S.pick.pop();drawOrder()">تراجع</button><button class="btn" onclick="chkOrder()">تأكيد الترتيب</button></div>`;
 }else{
  body=`<h2>فك الشفرة: ما الكلمة المخفية؟</h2><div class="row hg glyph">${[...q.w].map(l=>MAP[l]).join(' ')}</div>
  <div class="row">${Object.entries(MAP).map(([l,g])=>`<div class="key"><span class="hg">${g}</span><span>${l}</span></div>`).join('')}</div>
  <div class="card glyph" id="ans" style="min-height:3rem">&nbsp;</div>
  <div class="row">${Object.keys(MAP).map(l=>`<button class="chip" onclick="addL('${l}')">${l}</button>`).join('')}</div>
  <div class="row"><button class="btn alt" onclick="S.pick.pop();drawH()">مسح حرف</button><button class="btn" onclick="chkH()">افتح الخزانة</button></div>`;
 }
 $('#app').innerHTML=bar()+`<div class="card"><div class="top"><span>${S.c.t.split(':')[1]}</span><span>سؤال ${S.i+1}/${S.c.q.length}</span></div><div class="bar" style="margin:8px 0"><i id="tb"></i></div>${body}<div id="fb"></div></div>`;
 if(q.k=='clue')drawClues();if(q.k=='order')drawOrder();
 clearInterval(S.tm);S.tm=setInterval(()=>{S.left-=.25;$('#tb').style.width=Math.max(S.left/30*100,0)+'%';if(S.left<=0)done(false);},250);
}
function drawClues(){const q=S.c.q[S.i];$('#clues').innerHTML=q.c.slice(0,S.cl).map(x=>`<div class="clue">${x}</div>`).join('');if(S.cl>=q.c.length)$('#more').style.display='none';}
function more(){if(!S.lock){S.cl++;drawClues();}}
function pickOpt(j){if(S.lock)return;const q=S.c.q[S.i];const ok=S.opts[j][1]==q.a;
 document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(S.opts[n][1]==q.a)b.classList.add('g');});
 if(!ok)document.querySelectorAll('.opt')[j].classList.add('b');done(ok);}
function drawOrder(){$('#ch').innerHTML=S.opts.map((t,i)=>`<button class="chip ${S.pick.includes(t)?'used':''}" onclick="addO('${t}')">${t}</button>`).join('');
 $('#pl').innerHTML=S.pick.map((t,i)=>`<span class="chip">${i+1}. ${t}</span>`).join('');}
function addO(t){if(!S.lock&&!S.pick.includes(t)){S.pick.push(t);drawOrder();}}
function chkOrder(){const q=S.c.q[S.i];if(S.pick.length<q.items.length||S.lock)return;done(S.pick.join()==q.items.join());}
function drawH(){$('#ans').innerHTML=S.pick.map(l=>`<span class="hg">${MAP[l]}</span>`).join(' ')+' <small>'+S.pick.join('')+'</small>';}
function addL(l){if(!S.lock){S.pick.push(l);drawH();}}
function chkH(){if(!S.lock)done(S.pick.join('')==S.c.q[S.i].w);}
function done(ok){if(S.lock)return;S.lock=true;clearInterval(S.tm);const q=S.c.q[S.i];
 const base=q.k=='clue'?160-(S.cl-1)*40:q.k=='mc'?100:150;
 const pts=ok?base+Math.ceil(S.left/3):0;S.score+=pts;S.ok+=ok?1:0;
 const last=S.i==S.c.q.length-1;
 $('#fb').innerHTML=`<div class="fb ${ok?'g':'b'}"><b>${ok?'أحسنت! +'+pts+' نقطة':(S.left<=0?'انتهى الوقت!':'ليس تماماً')}</b><p>${q.e}</p><button class="btn" onclick="S.i++;ask()">${last?'النتيجة':'التالي'}</button></div>`;}
function end(){const p=S.ok/S.c.q.length;const s=p>=.8?'🥇':p>=.5?'🥈':'🥉';
 if(!S.seals[S.c.id]||['🥉','🥈','🥇'].indexOf(s)>['🥉','🥈','🥇'].indexOf(S.seals[S.c.id]))S.seals[S.c.id]=s;
 $('#app').innerHTML=bar()+`<div class="card" style="text-align:center"><div class="seal">${s}</div><h2>ختم محقق أثري</h2><p>أجبت صح عن ${S.ok} من ${S.c.q.length}. مستواك الآن: ${lvl()}</p><button class="btn" onclick="home()">العودة للقضايا</button> <button class="btn alt" onclick="start('${S.c.id}')">إعادة القضية</button></div>`;}
const FMAP={'ا':'𓄿','أ':'𓄿','إ':'𓄿','آ':'𓄿','ى':'𓇋','ي':'𓇋','ب':'𓃀','ت':'𓏏','ث':'𓍿','ج':'𓆓','ح':'𓎛','خ':'𓐍','د':'𓂧','ذ':'𓊨','ر':'𓂋','ز':'𓊃','س':'𓋴','ش':'𓈙','ص':'𓋴','ض':'𓂧','ط':'𓏏','ظ':'𓊨','ع':'𓂝','غ':'𓌅','ف':'𓆑','ق':'𓈎','ك':'𓎡','ل':'𓃭','م':'𓅓','ن':'𓈖','ه':'𓉔','و':'𓅱'};

AB.en=['Why I made this site','Egypt Vision 2030','Why did I build “Nile Code”?','I noticed that many people my age (12–18) know scattered facts about Egypt but often find traditional reading boring and far from their daily world, while they love games, challenges and interactive experiences. I wanted one place that combines fun, awareness and knowledge:',['Let students discover Egypt’s monuments of every era, its new cities, the presidents of the Republic with their terms and key moments, and hieroglyphic symbols — through an investigation-and-adventure style.','Give anyone looking for information a clear, organized reference, and let them write their own name in hieroglyphs inside a royal cartouche.','Most importantly: show the beauty of Egyptian identity and link its ancient past to its present and future in a language close to our generation, worthy of the State Award for the Young Creator.'],'Egypt Vision 2030','Egypt’s sustainable development strategy, launched on 24 February 2016 during the “Year of Youth” after about two years of preparation. It aims for a competitive, balanced economy based on knowledge and innovation, in line with the UN Sustainable Development Goals. An updated version issued in 2023 added enablers such as technology, innovation and digital transformation.','Its three dimensions and pillars in the first version:',[['Economic','Economic development • Energy • Knowledge, innovation and scientific research • Transparency and efficiency of public institutions'],['Social','Social justice • Health • Education and training • Culture'],['Environmental','Environment • Urban development']],'How does “Nile Code” serve this vision?',[['🏺 Culture and identity','The Monuments and Hieroglyphs cases bring our civilization closer and strengthen belonging.'],['🎓 Education and training','Learning through play and puzzles instead of rote memorization.'],['💡 Innovation and digital transformation','An interactive web platform built by a young creator that works on phones and computers.'],['🏙️ Urban development','The New Cities case introduces the generations of Egypt’s new urban communities.']],'Source: Egypt’s Ministry of Planning and Economic Development documents on Egypt Vision 2030.'];
AB.fr=['Pourquoi ce site','Vision Égypte 2030','Pourquoi ai-je créé « Code du Nil » ?','J’ai remarqué que beaucoup de jeunes de mon âge (12–18 ans) connaissent des informations éparses sur l’Égypte, mais trouvent la lecture classique ennuyeuse et éloignée de leur quotidien, alors qu’ils aiment les jeux, les défis et l’interactivité. Je voulais un lieu unique qui réunit plaisir, sensibilisation et savoir :',['Faire découvrir les monuments égyptiens de toutes les époques, les villes nouvelles, les présidents de la République avec la durée de leur mandat et leurs moments clés, et les symboles hiéroglyphiques, sous forme d’enquête et d’aventure.','Offrir une référence claire et organisée à ceux qui cherchent une information, et permettre d’écrire son nom en hiéroglyphes dans un cartouche royal.','Surtout : montrer la beauté de l’identité égyptienne et relier son passé à son présent et son avenir dans un langage proche de notre génération, digne du Prix d’État du Jeune Créateur.'],'Vision Égypte 2030','Stratégie de développement durable de l’Égypte, lancée le 24 février 2016 pendant l’« Année de la jeunesse » après environ deux ans de préparation. Elle vise une économie compétitive et équilibrée fondée sur le savoir et l’innovation, en phase avec les Objectifs de développement durable de l’ONU. Une version actualisée de 2023 ajoute des leviers comme la technologie, l’innovation et la transformation numérique.','Ses trois dimensions et piliers dans la première version :',[['Économique','Développement économique • Énergie • Savoir, innovation et recherche scientifique • Transparence et efficacité des institutions publiques'],['Social','Justice sociale • Santé • Éducation et formation • Culture'],['Environnemental','Environnement • Développement urbain']],'Comment « Code du Nil » sert-il cette vision ?',[['🏺 Culture et identité','Les enquêtes sur les monuments et les hiéroglyphes rapprochent de notre civilisation et renforcent l’appartenance.'],['🎓 Éducation et formation','Apprendre par le jeu et les énigmes plutôt que par cœur.'],['💡 Innovation et transformation numérique','Une plateforme web interactive créée par un jeune créateur, utilisable sur téléphone et ordinateur.'],['🏙️ Développement urbain','L’enquête sur les villes nouvelles présente les générations de villes nouvelles d’Égypte.']],'Source : documents du ministère égyptien de la Planification et du Développement économique sur la Vision 2030.'];
AB.es=['Por qué hice el sitio','Visión Egipto 2030','¿Por qué creé «Código del Nilo»?','Noté que muchos jóvenes de mi edad (12–18 años) conocen datos sueltos sobre Egipto, pero encuentran aburrida la lectura tradicional y lejana a su día a día, mientras que les encantan los juegos, los desafíos y las experiencias interactivas. Quise un solo lugar que una diversión, conciencia y conocimiento:',['Que el estudiante descubra los monumentos de Egipto de todas las épocas, sus ciudades nuevas, los presidentes de la República con la duración de sus mandatos y sus hitos, y los símbolos jeroglíficos, con estilo de investigación y aventura.','Ofrecer una referencia clara y ordenada a quien busca información, y permitir escribir su nombre en jeroglíficos dentro de un cartucho real.','Lo más importante: mostrar la belleza de la identidad egipcia y unir su pasado con su presente y futuro en un lenguaje cercano a nuestra generación, digno del Premio Estatal al Joven Creador.'],'Visión Egipto 2030','Estrategia de desarrollo sostenible de Egipto, lanzada el 24 de febrero de 2016 durante el «Año de la Juventud» tras unos dos años de preparación. Busca una economía competitiva y equilibrada basada en el conocimiento y la innovación, en línea con los Objetivos de Desarrollo Sostenible de la ONU. Una versión actualizada de 2023 añade facilitadores como tecnología, innovación y transformación digital.','Sus tres dimensiones y pilares en la primera versión:',[['Económica','Desarrollo económico • Energía • Conocimiento, innovación e investigación científica • Transparencia y eficiencia de las instituciones públicas'],['Social','Justicia social • Salud • Educación y formación • Cultura'],['Ambiental','Medio ambiente • Desarrollo urbano']],'¿Cómo sirve «Código del Nilo» a esta visión?',[['🏺 Cultura e identidad','Los casos de monumentos y jeroglíficos acercan nuestra civilización y refuerzan el sentido de pertenencia.'],['🎓 Educación y formación','Aprender jugando y resolviendo enigmas en lugar de memorizar.'],['💡 Innovación y transformación digital','Una plataforma web interactiva creada por un joven creador, que funciona en móvil y ordenador.'],['🏙️ Desarrollo urbano','El caso de las Ciudades Nuevas presenta las generaciones de nuevas ciudades de Egipto.']],'Fuente: documentos del Ministerio de Planificación y Desarrollo Económico de Egipto sobre la Visión 2030.'];
AB.de=['Warum ich die Seite gemacht habe','Vision Ägypten 2030','Warum habe ich „Nil-Code“ gebaut?','Mir ist aufgefallen, dass viele in meinem Alter (12–18) verstreute Fakten über Ägypten kennen, klassisches Lesen aber langweilig und weit weg vom Alltag finden, während sie Spiele, Herausforderungen und interaktive Erlebnisse lieben. Ich wollte einen Ort, der Spaß, Bewusstsein und Wissen verbindet:',['Schüler sollen Ägyptens Denkmäler aller Epochen, die neuen Städte, die Präsidenten der Republik mit Amtszeiten und wichtigen Stationen sowie Hieroglyphen entdecken – als Ermittlung und Abenteuer.','Wer Informationen sucht, findet ein klares, geordnetes Nachschlagewerk und kann seinen Namen in Hieroglyphen in einer königlichen Kartusche schreiben.','Am wichtigsten: die Schönheit der ägyptischen Identität zeigen und ihre Vergangenheit mit Gegenwart und Zukunft verbinden – in einer Sprache nahe unserer Generation und des Staatspreises für junge Kreative würdig.'],'Vision Ägypten 2030','Ägyptens Strategie für nachhaltige Entwicklung, am 24. Februar 2016 im „Jahr der Jugend“ nach rund zwei Jahren Vorbereitung gestartet. Ziel ist eine wettbewerbsfähige, ausgewogene Wirtschaft auf Basis von Wissen und Innovation, im Einklang mit den UN-Nachhaltigkeitszielen. Eine aktualisierte Fassung von 2023 ergänzt Wegbereiter wie Technologie, Innovation und digitale Transformation.','Ihre drei Dimensionen und Säulen in der ersten Fassung:',[['Wirtschaftlich','Wirtschaftsentwicklung • Energie • Wissen, Innovation und Forschung • Transparenz und Effizienz der Institutionen'],['Sozial','Soziale Gerechtigkeit • Gesundheit • Bildung und Ausbildung • Kultur'],['Ökologisch','Umwelt • Stadtentwicklung']],'Wie dient „Nil-Code“ dieser Vision?',[['🏺 Kultur und Identität','Die Fälle zu Denkmälern und Hieroglyphen bringen unsere Zivilisation näher und stärken die Zugehörigkeit.'],['🎓 Bildung und Ausbildung','Lernen durch Spiel und Rätsel statt Auswendiglernen.'],['💡 Innovation und digitale Transformation','Eine interaktive Webplattform eines jungen Kreativen, die auf Handy und Computer läuft.'],['🏙️ Stadtentwicklung','Der Fall „Neue Städte“ stellt die Generationen ägyptischer Neugründungen vor.']],'Quelle: Dokumente des ägyptischen Ministeriums für Planung und Wirtschaftsentwicklung zur Vision 2030.'];
AB.tr=['Siteyi neden yaptım','Mısır Vizyonu 2030','“Nil Şifresi”i neden yaptım?','Benim yaşımdaki (12–18) pek çok kişinin Mısır hakkında dağınık bilgiler bildiğini ama geleneksel okumayı sıkıcı ve günlük hayattan uzak bulduğunu, oyunları, meydan okumaları ve etkileşimli deneyimleri ise sevdiğini fark ettim. Eğlenceyi, farkındalığı ve bilgiyi tek yerde buluşturmak istedim:',['Öğrenciler Mısır’ın her döneme ait anıtlarını, yeni şehirlerini, cumhurbaşkanlarını görev süreleri ve önemli dönemeçleriyle ve hiyeroglif sembollerini soruşturma ve macera tarzıyla keşfetsin.','Bilgi arayanlar net ve düzenli bir kaynak bulsun, kendi isimlerini kraliyet kartuşunda hiyeroglifle yazabilsin.','En önemlisi: Mısır kimliğinin güzelliğini göstermek, kadim geçmişini bugünü ve geleceğiyle kuşağımıza yakın bir dille bağlamak.'],'Mısır Vizyonu 2030','Mısır’ın sürdürülebilir kalkınma stratejisi; yaklaşık iki yıllık hazırlıktan sonra 24 Şubat 2016’da “Gençlik Yılı” sırasında başlatıldı. Bilgi ve yeniliğe dayalı, rekabetçi ve dengeli bir ekonomiyi hedefler; BM Sürdürülebilir Kalkınma Hedefleriyle uyumludur. 2023’te yayımlanan güncel sürüm teknoloji, yenilik ve dijital dönüşüm gibi destekleyicileri ekledi.','İlk sürümdeki üç boyutu ve sütunları:',[['Ekonomik','Ekonomik kalkınma • Enerji • Bilgi, yenilik ve bilimsel araştırma • Kamu kurumlarında şeffaflık ve verimlilik'],['Sosyal','Sosyal adalet • Sağlık • Eğitim ve öğretim • Kültür'],['Çevresel','Çevre • Kentsel kalkınma']],'“Nil Şifresi” bu vizyona nasıl hizmet ediyor?',[['🏺 Kültür ve kimlik','Anıtlar ve hiyeroglif bölümleri uygarlığımızı yakınlaştırır, aidiyeti pekiştirir.'],['🎓 Eğitim ve öğretim','Ezber yerine oyun ve bulmacayla öğrenme.'],['💡 Yenilik ve dijital dönüşüm','Genç bir yaratıcının yaptığı, telefonda ve bilgisayarda çalışan etkileşimli web platformu.'],['🏙️ Kentsel kalkınma','Yeni Şehirler bölümü Mısır’ın yeni şehir nesillerini tanıtır.']],'Kaynak: Mısır Planlama ve Ekonomik Kalkınma Bakanlığının Vizyon 2030 belgeleri.'];
const aboutAr=about;

 shell(S.tab=='vision'?`<div class="card"><h2>🇪🇬 ${T[5]}</h2><p>${T[6]}</p><p class="small-mut">${T[7]}</p>${T[8].map((p,i)=>`<details class="gen" style="--c:${['#ffc300','#2ec4b6','#a06cd5'][i]}"><summary><b>${p[0]}</b></summary><div class="gb"><p>${p[1]}</p></div></details>`).join('')}<h2 style="margin-top:18px">🔗 ${T[9]}</h2>${T[10].map(p=>`<div class="info-item"><b>${p[0]}</b><p style="margin:2px 0 0">${p[1]}</p></div>`).join('')}<p class="small-mut">${T[11]}</p></div>`:`<div class="card"><h2>❓ ${T[2]}</h2><p>${T[3]}</p>${T[4].map(b=>`<div class="clue">${b}</div>`).join('')}</div>`);};
home();
